<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Nurettin Erdoğan profesyonel GitHub avatarı</title>
  <desc id="description">Koyu lacivert zemin üzerinde beyaz NE monogramı ve turkuaz marka noktası</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de3cf"/>
      <stop offset="1" stop-color="#2d8cff"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2f8"/>
    </linearGradient>
    <filter id="depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#00040a" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <path d="M750 -80L1085 826" stroke="#142944" stroke-width="135" opacity="0.28"/>

  <g filter="url(#depth)">
    <text x="492" y="631" text-anchor="middle" fill="url(#letters)"
      font-family="Segoe UI, Arial, sans-serif" font-size="384" font-weight="900" letter-spacing="-43">NE</text>
    <path d="M337 327L523 697" stroke="url(#accent)" stroke-width="30" stroke-linecap="round"/>
    <circle cx="753" cy="626" r="25" fill="url(#accent)"/>
  </g>
</svg>
